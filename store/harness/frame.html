<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
  body { background: var(--bg); color: var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  body.light { --bg: linear-gradient(135deg, #eaf0ff, #f7f9ff); --fg: #14213d; --card: #fff; }
  body.dark  { --bg: linear-gradient(135deg, #10131c, #1a2033); --fg: #f1f4ff; --card: #1f2330; }
  h1 { margin: 0; font-size: 44px; letter-spacing: -0.5px; }
  p { margin: 0; font-size: 22px; opacity: 0.7; }
  .pop { width: 720px; height: 420px; border-radius: 12px; overflow: hidden; background: var(--card); box-shadow: 0 24px 60px rgba(20, 33, 61, 0.28), 0 0 0 1px rgba(127,127,127,.25); transform: scale(1.25); margin: 70px 0 40px; }
  iframe { width: 720px; height: 420px; border: 0; color-scheme: light dark; }
</style></head><body>
  <h1 id="h"></h1><p id="s"></p>
  <div class="pop"><iframe id="f"></iframe></div>
  <script>
    const p = new URLSearchParams(location.search);
    document.body.className = p.get("theme") || "light";
    document.getElementById("h").textContent = p.get("h") || "";
    document.getElementById("s").textContent = p.get("s") || "";
    p.delete("theme"); p.delete("h"); p.delete("s");
    const f = document.getElementById("f");
    f.style.colorScheme = document.body.className;
    f.src = "popup-mock.html?" + p.toString();
  </script>
</body></html>
